        '422': {$ref: '#/components/responses/Error'}
  /me/sessions:
    get:
      summary: List active refresh-capable device sessions
      operationId: listMyDeviceSessions
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Active device sessions, content: {application/json: {schema: {$ref: '#/components/schemas/DeviceSessionListEnvelope'}}}}
        '401': {$ref: '#/components/responses/Error'}
  /me/sessions/{session_id}:
    delete:
      summary: Revoke one device session owned by the current user
      operationId: revokeMyDeviceSession
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/SessionID'}]
      responses:
        '200': {$ref: '#/components/responses/Interaction'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /conversations/{conversation_id}/read:
    put:
      summary: Monotonically advance the current member's read receipt
      description: An empty message_id marks the current latest message. Older receipts never move the checkpoint backward.
      operationId: markConversationRead
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ConversationID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {message_id: {type: string}}
      responses:
        '200': {description: Current receipt, content: {application/json: {schema: {$ref: '#/components/schemas/ConversationReceiptEnvelope'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /conversations/{conversation_id}/membership:
    delete:
      summary: Leave a conversation without deleting its durable history
      description: A leaver cannot read or send new messages and is never silently re-added by member-set reuse.
      operationId: leaveConversation
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ConversationID'}]
      responses:
        '200': {$ref: '#/components/responses/Interaction'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /homepage:
    get:
