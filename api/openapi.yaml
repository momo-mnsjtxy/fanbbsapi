      operationId: getProduct
      parameters: [{name: product_id, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Product, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /me/cart:
    get:
      summary: List the authenticated user's local cart
      operationId: getCart
      security: [{bearerAuth: []}]
      responses: {'200': {description: Cart, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}, '401': {$ref: '#/components/responses/Error'}}
  /me/cart/{product_id}:
    put:
      summary: Set a bounded cart quantity after checking current local inventory
      operationId: setCartItem
      security: [{bearerAuth: []}]
      parameters: [{name: product_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [quantity], properties: {quantity: {type: integer, minimum: 1, maximum: 100}}}}}}
      responses: {'200': {description: Cart item, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}, '409': {$ref: '#/components/responses/Error'}}
    delete:
      summary: Remove a local cart item
      operationId: deleteCartItem
      security: [{bearerAuth: []}]
      parameters: [{name: product_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Removal result, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}}
  /orders:
    post:
      summary: Create a non-payment order and atomically reserve local integer inventory
      description: Clears the cart in the same transaction. This operation never charges money, spends points, creates a provider intent, or buys paid content.
      operationId: createLocalOrder
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '201': {description: Inventory reserved and order created, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}
        '200': {description: Idempotent replay, headers: {Idempotency-Replayed: {schema: {type: string, const: 'true'}}}, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}
        '409': {$ref: '#/components/responses/Error'}
    get:
      summary: List the authenticated user's orders
      operationId: listMyOrders
      security: [{bearerAuth: []}]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [created, cancelled, fulfilled]}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses: {'200': {description: Orders, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}}
  /orders/{order_id}:
    get:
      summary: Get an owned order with immutable product snapshots
      operationId: getMyOrder
      security: [{bearerAuth: []}]
      parameters: [{name: order_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Order, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}, '404': {$ref: '#/components/responses/Error'}}
  /orders/{order_id}/cancel:
    post:
      summary: Cancel an owned created order and restore reserved inventory exactly once
      operationId: cancelMyOrder
      security: [{bearerAuth: []}]
      parameters: [{name: order_id, in: path, required: true, schema: {type: string}}]
      requestBody: {content: {application/json: {schema: {type: object, properties: {reason: {type: string, maxLength: 500}}}}}}
      responses: {'200': {description: Cancelled or idempotent terminal result, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}, '409': {$ref: '#/components/responses/Error'}}
  /me/check-in:
    post:
      summary: Claim the UTC daily local check-in award exactly once
      description: Awards five local community points. Points are non-cash, non-transferable, non-purchasable, non-redeemable, and unrelated to orders.
      operationId: dailyCheckIn
      security: [{bearerAuth: []}]
      responses: {'200': {description: Award or idempotent replay, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}}
  /me/gamification:
    get:
      summary: Get local points, threshold-derived level, title, rank, and selected frame
      operationId: getMyGamification
      security: [{bearerAuth: []}]
      responses: {'200': {description: Gamification status, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}}
  /me/points:
    get:
      summary: List immutable local point awards
      operationId: listMyPointEvents
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {description: Point awards, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}}
  /tasks:
    get:
      summary: List active configured tasks and the current user's period claim state
      description: Task completion is awarded only through an admin-verified local event; clients cannot self-attest completion.
      operationId: listGamificationTasks
      security: [{bearerAuth: []}]
      responses: {'200': {description: Tasks, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}}
  /ranks:
    get:
      summary: List the local lifetime-points leaderboard with levels and titles
      operationId: listGamificationRanks
      parameters: [{name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}]
      responses: {'200': {description: Rank entries, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}}
  /avatar-frames:
    get:
      summary: List active avatar frames
      operationId: listAvatarFrames
      responses: {'200': {description: Frame catalog, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}}
  /me/avatar-frames:
    get:
      summary: List active avatar frames with the authenticated user's entitlement and selection state
      operationId: listMyAvatarFrames
      security: [{bearerAuth: []}]
      responses: {'200': {description: Frame catalog and entitlements, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}}
  /me/avatar-frame:
    put:
      summary: Select an entitled active avatar frame, or clear selection with an empty ID
      operationId: selectMyAvatarFrame
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [frame_id], properties: {frame_id: {type: string}}}}}}
      responses: {'200': {description: Selection, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}, '403': {$ref: '#/components/responses/Error'}}
  /admin/product-types:
    get:
      summary: List all product types including archived types
      operationId: adminListProductTypes
      security: [{bearerAuth: []}]
      responses: {'200': {description: Product types, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}}
    post:
      summary: Create an audited product type
      operationId: adminCreateProductType
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProductTypeInput'}}}}
      responses: {'201': {description: Product type, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}, '403': {$ref: '#/components/responses/Error'}}
  /admin/product-types/{type_id}:
    patch:
      summary: Replace an audited product type configuration
      operationId: adminUpdateProductType
      security: [{bearerAuth: []}]
      parameters: [{name: type_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProductTypeInput'}}}}
      responses: {'200': {description: Product type, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}}
    delete:
      summary: Delete an unused product type with an immutable audit event
      operationId: adminDeleteProductType
      security: [{bearerAuth: []}]
      parameters: [{name: type_id, in: path, required: true, schema: {type: string}}, {name: reason, in: query, schema: {type: string, maxLength: 500}}]
      responses: {'200': {description: Deleted, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}, '409': {$ref: '#/components/responses/Error'}}
  /admin/products:
    get:
      summary: List products including draft and archived products
      operationId: adminListProducts
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {description: Products, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}}
    post:
      summary: Create an audited local product with bounded integer inventory
      operationId: adminCreateProduct
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProductInput'}}}}
      responses: {'201': {description: Product, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}}
  /admin/products/{product_id}:
    get:
      summary: Get a product including inactive state
      operationId: adminGetProduct
      security: [{bearerAuth: []}]
      parameters: [{name: product_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Product, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}}
    patch:
      summary: Update audited catalog and bounded inventory fields
      operationId: adminUpdateProduct
      security: [{bearerAuth: []}]
      parameters: [{name: product_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProductInput'}}}}
      responses: {'200': {description: Product, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}}
    delete:
      summary: Delete a never-ordered product; ordered products must be archived
      operationId: adminDeleteProduct
      security: [{bearerAuth: []}]
      parameters: [{name: product_id, in: path, required: true, schema: {type: string}}, {name: reason, in: query, schema: {type: string, maxLength: 500}}]
      responses: {'200': {description: Deleted, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}, '409': {$ref: '#/components/responses/Error'}}
  /admin/orders:
    get:
      summary: List all local non-payment orders
      operationId: adminListOrders
      security: [{bearerAuth: []}]
      parameters: [{name: status, in: query, schema: {type: string, enum: [created, cancelled, fulfilled]}}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {description: Orders, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}}
  /admin/orders/{order_id}:
    get:
      summary: Get any local order
      operationId: adminGetOrder
      security: [{bearerAuth: []}]
      parameters: [{name: order_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Order, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}}
    patch:
      summary: Audit an explicit local cancellation or manual fulfillment with tracking metadata
      description: Fulfillment records metadata only; no external shipping or payment provider is called.
      operationId: adminTransitionOrder
      security: [{bearerAuth: []}]
      parameters: [{name: order_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OrderTransitionInput'}}}}
      responses: {'200': {description: Transitioned order, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}, '409': {$ref: '#/components/responses/Error'}}
  /admin/tasks:
    get:
      summary: List all local tasks
      operationId: adminListTasks
      security: [{bearerAuth: []}]
      responses: {'200': {description: Tasks, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}}
    post:
      summary: Create an audited task reward definition
      operationId: adminCreateTask
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TaskInput'}}}}
      responses: {'201': {description: Task, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}}
  /admin/tasks/{task_id}:
    patch:
      summary: Replace an audited task reward definition
      operationId: adminUpdateTask
      security: [{bearerAuth: []}]
      parameters: [{name: task_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TaskInput'}}}}
      responses: {'200': {description: Task, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}}
  /admin/users/{user_id}/tasks/{task_id}/award:
    post:
      summary: Award a server/admin-verified task period exactly once
      operationId: adminAwardTask
      security: [{bearerAuth: []}]
      parameters: [{name: user_id, in: path, required: true, schema: {type: string}}, {name: task_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [claim_key], properties: {claim_key: {type: string, minLength: 1, maxLength: 128}, reason: {type: string, maxLength: 500}}}}}}
      responses: {'200': {description: Award or idempotent replay, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}}
  /admin/avatar-frames:
    get:
      summary: List all avatar frames
      operationId: adminListAvatarFrames
      security: [{bearerAuth: []}]
      responses: {'200': {description: Frames, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}}
    post:
      summary: Create an audited avatar frame
      operationId: adminCreateAvatarFrame
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FrameInput'}}}}
      responses: {'201': {description: Frame, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}}
  /admin/avatar-frames/{frame_id}:
    patch:
      summary: Replace an audited avatar frame definition
      operationId: adminUpdateAvatarFrame
      security: [{bearerAuth: []}]
      parameters: [{name: frame_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FrameInput'}}}}
      responses: {'200': {description: Frame, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}}
  /admin/users/{user_id}/avatar-frames/{frame_id}:
    post:
      summary: Grant an avatar-frame entitlement with an immutable audit event
      operationId: adminGrantAvatarFrame
      security: [{bearerAuth: []}]
      parameters: [{name: user_id, in: path, required: true, schema: {type: string}}, {name: frame_id, in: path, required: true, schema: {type: string}}]
      requestBody: {content: {application/json: {schema: {type: object, properties: {reason: {type: string, maxLength: 500}}}}}}
      responses: {'200': {description: Entitlement, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}}
  /admin/users/{user_id}/points:
    post:
      summary: Grant award-only local points with idempotency and audit
      operationId: adminGrantLocalPoints
      security: [{bearerAuth: []}]
      parameters: [{name: user_id, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/RequiredIdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [amount, description], properties: {amount: {type: integer, minimum: 1, maximum: 100000}, description: {type: string, minLength: 1, maxLength: 200}}}}}}
      responses: {'200': {description: Award or idempotent replay, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    PostID: {name: post_id, in: path, required: true, schema: {type: string}}
    UserID: {name: user_id, in: path, required: true, schema: {type: string}}
    ReportID: {name: report_id, in: path, required: true, schema: {type: string}}
    CommentID: {name: comment_id, in: path, required: true, schema: {type: string}}
    MediaID: {name: media_id, in: path, required: true, schema: {type: string}}
    ConversationID: {name: conversation_id, in: path, required: true, schema: {type: string}}
    CategoryID: {name: category_id, in: path, required: true, schema: {type: string}}
    TagID: {name: tag_id, in: path, required: true, schema: {type: string}}
    SessionID: {name: session_id, in: path, required: true, schema: {type: string}}
    IfMatch: {name: If-Match, in: header, required: true, description: Quoted positive integer version returned as ETag., schema: {type: string}}
    Cursor: {name: cursor, in: query, schema: {type: string}, description: Opaque cursor returned by page.next_cursor.}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: false, schema: {type: string, maxLength: 128}}
    RequiredIdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
  responses:
    Session:
      description: Authenticated device session
      content: {application/json: {schema: {$ref: '#/components/schemas/SessionEnvelope'}}}
    Post:
      description: Post response
      content: {application/json: {schema: {$ref: '#/components/schemas/PostEnvelope'}}}
    PostList:
      description: Cursor-paged posts
      content: {application/json: {schema: {$ref: '#/components/schemas/PostListEnvelope'}}}
    Comment:
      description: Comment response
      content: {application/json: {schema: {$ref: '#/components/schemas/CommentEnvelope'}}}
    CommentList:
      description: Cursor-paged comments
      content: {application/json: {schema: {$ref: '#/components/schemas/CommentListEnvelope'}}}
    Interaction:
      description: Idempotent interaction state
      content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}
    Error:
      description: Structured API error
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    Media:
      description: Stored media metadata
      content: {application/json: {schema: {$ref: '#/components/schemas/MediaEnvelope'}}}
    Conversation:
      description: Private conversation
      content: {application/json: {schema: {$ref: '#/components/schemas/ConversationEnvelope'}}}
    Message:
      description: Private message
      content: {application/json: {schema: {$ref: '#/components/schemas/MessageEnvelope'}}}
  schemas:
    ProductTypeInput:
      type: object
      required: [slug, name]
      properties:
        slug: {type: string, pattern: '^[a-z0-9]+(?:[-_][a-z0-9]+)*$', minLength: 2, maxLength: 64}
        name: {type: string, minLength: 1, maxLength: 80}
        status: {type: string, enum: [active, archived], default: active}
        reason: {type: string, maxLength: 500}
    ProductInput:
      type: object
      required: [type_id, sku, name]
      properties:
        type_id: {type: string}
        sku: {type: string, pattern: '^[a-z0-9]+(?:[-_][a-z0-9]+)*$', minLength: 2, maxLength: 64}
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 2000}
        inventory: {type: integer, minimum: 0, maximum: 1000000}
        status: {type: string, enum: [draft, active, archived], default: draft}
        reason: {type: string, maxLength: 500}
    OrderTransitionInput:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [cancelled, fulfilled]}
        fulfillment_carrier: {type: string, maxLength: 100}
        tracking_code: {type: string, maxLength: 200}
        reason: {type: string, maxLength: 500}
    TaskInput:
      type: object
      required: [code, name, repeat_policy]
      properties:
        code: {type: string, pattern: '^[a-z0-9]+(?:[-_][a-z0-9]+)*$', minLength: 2, maxLength: 64}
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 1000}
        repeat_policy: {type: string, enum: [once, daily]}
        reward_points: {type: integer, minimum: 0, maximum: 100000}
        reward_frame_id: {type: string}
        status: {type: string, enum: [active, archived], default: active}
        reason: {type: string, maxLength: 500}
    FrameInput:
      type: object
      required: [slug, name, image_url]
      properties:
        slug: {type: string, pattern: '^[a-z0-9]+(?:[-_][a-z0-9]+)*$', minLength: 2, maxLength: 64}
        name: {type: string, minLength: 1, maxLength: 100}
        image_url: {type: string, minLength: 1, maxLength: 500}
        status: {type: string, enum: [active, archived], default: active}
        reason: {type: string, maxLength: 500}
    Meta:
      type: object
      required: [request_id]
      properties: {request_id: {type: string}}
    Page:
      type: object
      required: [next_cursor]
      properties: {next_cursor: {type: string}}
    User:
      type: object
      required: [id, handle, name, display_name]
      properties:
        id: {type: string}
        handle: {type: string}
        email: {type: string, format: email}
        name: {type: string}
        display_name: {type: string}
        avatar_url: {type: string}
        bio: {type: string}
        role: {type: string}
        created_at: {type: string, format: date-time}
    Author:
      type: object
      required: [id, handle, name, display_name, avatar_url]
      properties:
        id: {type: string}
        handle: {type: string}
        name: {type: string}
        display_name: {type: string}
        avatar_url: {type: string}
    Post:
      type: object
      required: [id, kind, title, content, visibility, version, like_count, comment_count, repost_count, liked, reposted, author, created_at]
      properties:
        id: {type: string}
        kind: {type: string, enum: [article, image, video, repost]}
        repost_of: {type: string}
        title: {type: string}
        summary: {type: string}
        body: {type: string, description: Canonical detail field; omitted from feed items.}
        content: {type: string, description: Vue-compatible content projection.}
        status: {type: string, enum: [draft, pending, published, rejected, deleted]}
        visibility: {type: string, enum: [public, followers]}
        version: {type: integer}
        pinned: {type: boolean}
        recommended: {type: boolean}
        like_count: {type: integer}
        comment_count: {type: integer}
        repost_count: {type: integer}
        likes: {type: integer}
        comments: {type: integer}
        reposts: {type: integer}
        views: {type: integer}
        liked: {type: boolean}
        reposted: {type: boolean}
        bookmarked: {type: boolean}
        age: {type: string}
        avatar: {type: string}
        author: {$ref: '#/components/schemas/Author'}
        category: {$ref: '#/components/schemas/Category'}
        tags: {type: array, items: {$ref: '#/components/schemas/Tag'}}
        media: {type: array, items: {$ref: '#/components/schemas/MediaAsset'}}
        created_at: {type: string, format: date-time}
        published_at: {type: string, format: date-time}
    Comment:
      type: object
      required: [id, post_id, depth, body, content, author, created_at]
      properties:
        id: {type: string}
        post_id: {type: string}
        parent_id: {type: string}
        root_id: {type: string}
        depth: {type: integer, minimum: 0, maximum: 2}
        body: {type: string}
        content: {type: string}
        like_count: {type: integer}
        liked: {type: boolean}
        version: {type: integer}
        age: {type: string}
        created_at: {type: string, format: date-time}
        author: {$ref: '#/components/schemas/Author'}
    CreatePost:
      type: object
      properties:
        content: {type: string, minLength: 1, maxLength: 50000, description: Vue-compatible alias for body.}
        body: {type: string, minLength: 1, maxLength: 50000}
        title: {type: string, minLength: 3, maxLength: 120, description: Derived from content when omitted.}
        summary: {type: string, maxLength: 500}
        kind: {type: string, enum: [article, image, video], default: article}
        category_id: {type: string}
        tag_ids: {type: array, maxItems: 10, uniqueItems: true, items: {type: string}}
        media_ids: {type: array, maxItems: 8, uniqueItems: true, items: {type: string}}
        visibility: {type: string, enum: [public, followers], default: public}
        status: {type: string, enum: [pending], description: Explicitly submit for moderator review; omit for the backward-compatible immediate-publish flow.}
      anyOf: [{required: [content]}, {required: [body]}]
    Session:
      type: object
      required: [session_id, access_token, refresh_token, token_type, expires_in, user]
      properties:
        session_id: {type: string}
        access_token: {type: string}
        refresh_token: {type: string}
        token_type: {type: string, const: Bearer}
        expires_in: {type: integer, const: 900}
        user: {$ref: '#/components/schemas/User'}
        recovery_codes: {type: array, minItems: 8, maxItems: 8, items: {type: string}, description: Present only in the registration response and never returned by login or refresh.}
    DataEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta: {$ref: '#/components/schemas/Meta'}
    SessionEnvelope:
      type: object
      required: [data, meta]
