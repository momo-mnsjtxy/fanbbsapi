      responses:
        '200': {description: Current config with ETag version, content: {application/json: {schema: {$ref: '#/components/schemas/HomepageConfigEnvelope'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    patch:
