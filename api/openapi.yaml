openapi: 3.1.0
info:
  title: FanBBS local vertical-slice API
  version: 0.2.0
  description: >-
    Contract for the locally runnable identity, community, private-messaging,
    notification, moderation, administration, local account recovery,
    local non-payment commerce, and
    non-cash gamification slice. Messaging uses durable
    HTTP resources plus a polling event cursor; WebSockets and external push are
    not enabled. External SMS/email/OAuth, payments, cash wallets, withdrawals,
    lottery, paid-content purchase, external fulfillment, and external object
    storage are also not enabled. Local orders contain no prices or payment
    state; local community points cannot be purchased, transferred, redeemed,
    or spent. Media uses the bounded
    local-filesystem development adapter. SQLite remains the local-development
    default; the production database adapter uses pgx and PostgreSQL 17 with a
    separately versioned, rehearsed migration stream.
servers:
  - url: http://localhost:8080/api/v1
security: []
paths:
  /auth/register:
    post:
      summary: Create a local password account and device session
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handle, email, password]
              properties:
                handle: {type: string, pattern: '^[a-z0-9_]{3,24}$'}
                email: {type: string, format: email, description: Local login identifier only; this slice sends no email.}
                password: {type: string, minLength: 8, maxLength: 128}
                display_name: {type: string, maxLength: 50}
      responses:
        '201': {$ref: '#/components/responses/Session'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /auth/login:
    post:
      summary: Log in with a handle or email
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identity, password]
              properties:
                identity: {type: string, minLength: 1, description: Handle or email. `account` is also accepted.}
                password: {type: string, minLength: 1}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /auth/recover:
    post:
      summary: Redeem one local recovery code, reset the password, revoke sessions, and rotate codes
      description: Recovery codes are generated locally, stored only as digests, and returned in plaintext only when issued. No email, SMS, or OAuth provider is used.
      operationId: recoverLocalAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identity, recovery_code, new_password]
              properties:
                identity: {type: string, description: Handle or email. `account` is also accepted.}
                recovery_code: {type: string}
                new_password: {type: string, minLength: 8, maxLength: 128}
      responses:
        '200': {description: Password changed and replacement one-time recovery codes issued, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /auth/refresh:
    post:
      summary: Rotate a refresh session
      operationId: refreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '401': {$ref: '#/components/responses/Error'}
  /auth/logout:
    post:
      summary: Revoke the current device session
      operationId: logout
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DataEnvelope'}
        '401': {$ref: '#/components/responses/Error'}
  /posts:
    get:
      summary: List a feed
      operationId: listPosts
      parameters:
        - name: feed
          in: query
          schema: {type: string, enum: [recommend, recommended, latest, global, following], default: recommend}
        - {name: category_id, in: query, schema: {type: string}}
        - {name: tag_id, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {$ref: '#/components/responses/PostList'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    post:
      summary: Publish a post or explicitly submit it for moderation
      operationId: createPost
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePost'}
      responses:
        '201': {$ref: '#/components/responses/Post'}
        '200': {description: Idempotent replay, headers: {Idempotency-Replayed: {schema: {type: string, const: 'true'}}}, content: {application/json: {schema: {$ref: '#/components/schemas/PostEnvelope'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /feeds/{feed}:
    get:
      summary: List a named feed
      operationId: listNamedFeed
      parameters:
        - name: feed
          in: path
          required: true
          schema: {type: string, enum: [recommend, recommended, latest, global, following]}
        - {name: category_id, in: query, schema: {type: string}}
        - {name: tag_id, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {$ref: '#/components/responses/PostList'}
        '401': {$ref: '#/components/responses/Error'}
  /posts/{post_id}:
    get:
      summary: Get a published post
      operationId: getPost
      parameters:
        - {$ref: '#/components/parameters/PostID'}
      responses:
        '200': {$ref: '#/components/responses/Post'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      summary: Edit an owned post with optimistic concurrency control
      operationId: updatePost
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/PostID'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title: {type: string, minLength: 3, maxLength: 120}
                summary: {type: string, maxLength: 500}
                content: {type: string, minLength: 1, maxLength: 50000}
                body: {type: string, minLength: 1, maxLength: 50000}
                category_id: {type: string}
                tag_ids: {type: array, maxItems: 10, items: {type: string}}
                visibility: {type: string, enum: [public, followers]}
      responses:
        '200': {$ref: '#/components/responses/Post'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '428': {$ref: '#/components/responses/Error'}
    delete:
      summary: Soft-delete an owned post at the expected version
      operationId: deletePost
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/PostID'}
        - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '200': {$ref: '#/components/responses/Interaction'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '428': {$ref: '#/components/responses/Error'}
  /posts/{post_id}/comments:
    get:
      summary: List comments and replies
      operationId: listComments
      parameters:
        - {$ref: '#/components/parameters/PostID'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {$ref: '#/components/responses/CommentList'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      summary: Comment or reply using parent_id
      operationId: createComment
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/PostID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: {type: string, minLength: 1, maxLength: 2000, description: '`body` is also accepted.'}
                parent_id: {type: string}
      responses:
        '201': {$ref: '#/components/responses/Comment'}
        '200': {$ref: '#/components/responses/Comment'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /posts/{post_id}/revisions:
    get:
      summary: List immutable prior versions of an owned post
      operationId: listOwnedPostRevisions
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/PostID'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: Owner-only prior post snapshots, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /posts/{post_id}/comments/{comment_id}/replies:
    post:
      summary: Reply to one comment
      operationId: replyToComment
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/PostID'}
        - name: comment_id
          in: path
          required: true
          schema: {type: string}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: {type: string, minLength: 1, maxLength: 2000}
      responses:
        '201': {$ref: '#/components/responses/Comment'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /posts/{post_id}/reactions/like:
    put:
      summary: Idempotently like a post
      operationId: likePost
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/PostID'}]
      responses:
        '200': {$ref: '#/components/responses/Interaction'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      summary: Idempotently remove the current user's like
      operationId: unlikePost
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/PostID'}]
      responses:
        '200': {$ref: '#/components/responses/Interaction'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /posts/{post_id}/comments/{comment_id}:
    patch:
      summary: Edit an owned comment at the expected version
      operationId: updateComment
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/PostID'}
        - {$ref: '#/components/parameters/CommentID'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: {type: string, minLength: 1, maxLength: 2000}
                body: {type: string, minLength: 1, maxLength: 2000}
              anyOf: [{required: [content]}, {required: [body]}]
      responses:
        '200': {$ref: '#/components/responses/Comment'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '428': {$ref: '#/components/responses/Error'}
    delete:
      summary: Soft-delete an owned comment and maintain the post counter
      operationId: deleteComment
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/PostID'}
        - {$ref: '#/components/parameters/CommentID'}
        - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '200': {$ref: '#/components/responses/Interaction'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /posts/{post_id}/comments/{comment_id}/reactions/like:
    put:
      summary: Idempotently like a visible comment
      operationId: likeComment
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/PostID'}
        - {$ref: '#/components/parameters/CommentID'}
      responses:
        '200': {$ref: '#/components/responses/Interaction'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      summary: Idempotently remove the current user's comment like
      operationId: unlikeComment
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/PostID'}
        - {$ref: '#/components/parameters/CommentID'}
      responses:
        '200': {$ref: '#/components/responses/Interaction'}
  /posts/{post_id}/repost:
    put:
      summary: Idempotently repost a post
      operationId: repostPost
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/PostID'}]
      responses:
        '200': {$ref: '#/components/responses/Post'}
        '401': {$ref: '#/components/responses/Error'}
  /posts/{post_id}/reposts:
    put:
      summary: Canonical plural alias for idempotent repost
      operationId: repostPostCanonical
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/PostID'}]
      responses:
        '200': {$ref: '#/components/responses/Post'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      summary: Canonical plural alias for undoing a repost
      operationId: undoRepostCanonical
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/PostID'}]
      responses:
        '200': {$ref: '#/components/responses/Interaction'}
  /me:
    get:
      summary: Get the authenticated private profile
      operationId: getMe
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Current user, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}
    delete:
      summary: Soft-deactivate the current local account and revoke its sessions
      operationId: deactivateMe
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Account deactivated, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}
  /me/account:
    delete:
      summary: Explicit alias for soft account deactivation
      operationId: deactivateMyAccount
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Account deactivated, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}
  /me/profile:
    patch:
      summary: Update allowlisted profile fields
      operationId: updateMyProfile
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: {type: string, minLength: 1, maxLength: 50}
                bio: {type: string, maxLength: 500}
                avatar_url: {type: string, format: uri, maxLength: 500}
              minProperties: 1
      responses:
        '200': {description: Updated private user, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /me/avatar:
    put:
      summary: Upload an image through the blob adapter and set it as the current avatar
      operationId: uploadMyAvatar
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
                alt_text: {type: string, maxLength: 500}
      responses:
        '201': {$ref: '#/components/responses/Media'}
        '413': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /uploads:
    post:
      summary: Upload post media to the local blob adapter
      operationId: uploadPostMedia
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
                alt_text: {type: string, maxLength: 500}
      responses:
        '201': {$ref: '#/components/responses/Media'}
        '413': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /uploads/{media_id}:
    delete:
      summary: Abandon owned media that has not been attached to any resource
      description: Deletes only owner-scoped, unreferenced media from the local blob lifecycle. Attached post, avatar, cover, and homepage assets are never deleted.
      operationId: abandonMedia
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/MediaID'}]
      responses:
        '204': {description: Unattached media abandoned; an empty response is returned}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /media/{media_id}:
    get:
      summary: Stream owned, avatar, or viewer-visible post media
      operationId: getMedia
      parameters: [{$ref: '#/components/parameters/MediaID'}]
      responses:
        '200':
          description: Stored media bytes
          headers:
            ETag: {schema: {type: string}}
            X-Content-Type-Options: {schema: {type: string, const: nosniff}}
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            image/gif: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
            video/mp4: {schema: {type: string, format: binary}}
        '404': {$ref: '#/components/responses/Error'}
  /me/password:
    put:
      summary: Change the local password and revoke other sessions
      operationId: changeMyPassword
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: {type: string}
                new_password: {type: string, minLength: 8, maxLength: 128}
      responses:
        '200': {description: Password changed, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}
        '401': {$ref: '#/components/responses/Error'}
  /me/recovery-codes/rotate:
    post:
      summary: Revoke active recovery codes and issue a replacement set once
      operationId: rotateMyRecoveryCodes
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password]
              properties: {current_password: {type: string}}
      responses:
        '200': {description: New plaintext recovery codes; this response is their only display, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /me/activity:
    get:
      summary: List privacy-safe post, comment, and report activity for the authenticated owner
      operationId: listMyActivity
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: IDs, actions, states and timestamps without bodies, messages or contact data, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}
  /categories:
    get:
      summary: List categories
      operationId: listCategories
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/DataEnvelope'}
  /tags:
    get:
      summary: List tags
      operationId: listTags
      responses:
        '200':
          description: Tags
          content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}
  /search:
    get:
      summary: Search viewer-visible posts, public user fields, and tags
      operationId: search
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 2, maxLength: 100}}
        - {name: type, in: query, schema: {type: string, enum: [all, posts, users, tags], default: all}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Grouped search results
          content: {application/json: {schema: {$ref: '#/components/schemas/SearchEnvelope'}}}
        '422': {$ref: '#/components/responses/Error'}
  /posts/{post_id}/bookmark:
    put:
      summary: Idempotently bookmark a visible post
      operationId: bookmarkPost
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/PostID'}]
      responses:
        '200': {$ref: '#/components/responses/Interaction'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      summary: Idempotently remove the current user's bookmark
      operationId: unbookmarkPost
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/PostID'}]
      responses:
        '200': {$ref: '#/components/responses/Interaction'}
  /me/bookmarks:
    get:
      summary: List the current user's viewer-visible bookmarks
      operationId: listMyBookmarks
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {$ref: '#/components/responses/PostList'}
  /users/{user_id}/follow:
    put:
      summary: Idempotently follow an active user
      operationId: followUser
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UserID'}]
      responses:
        '200': {$ref: '#/components/responses/Interaction'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    delete:
      summary: Idempotently unfollow a user
      operationId: unfollowUser
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UserID'}]
      responses:
        '200': {$ref: '#/components/responses/Interaction'}
  /notifications:
    get:
      summary: List durable notifications owned by the current user
      operationId: listNotifications
      security: [{bearerAuth: []}]
      parameters:
        - {name: unread, in: query, schema: {type: boolean, default: false}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Notification page
          content: {application/json: {schema: {$ref: '#/components/schemas/NotificationListEnvelope'}}}
  /notifications/read:
    put:
      summary: Idempotently mark selected notifications, or all when ids is empty, read
      operationId: markNotificationsRead
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: {type: array, maxItems: 100, items: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/Interaction'}
  /conversations:
    get:
      summary: List the current user's active conversations, newest activity first
      operationId: listConversations
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Cursor-paged conversations owned by the authenticated membership
          content: {application/json: {schema: {$ref: '#/components/schemas/ConversationListEnvelope'}}}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    post:
      summary: Create or reuse the active conversation with exactly this member set
      description: >-
        The authenticated user is added as owner. A reversed or repeated member set
        returns the existing active conversation with Idempotency-Replayed: true.
      operationId: createConversation
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateConversation'}
      responses:
        '201': {$ref: '#/components/responses/Conversation'}
        '200':
          description: Existing active conversation for the same member set
          headers:
            Idempotency-Replayed: {schema: {type: string, const: 'true'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/ConversationEnvelope'}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /conversations/{conversation_id}:
    get:
      summary: Get an active conversation visible to the current member
      operationId: getConversation
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ConversationID'}]
      responses:
        '200': {$ref: '#/components/responses/Conversation'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /conversations/{conversation_id}/messages:
    get:
      summary: List conversation messages newest first
      description: The opaque cursor is scoped to the authenticated user and conversation.
      operationId: listConversationMessages
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ConversationID'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Cursor-paged messages for a current member
          content: {application/json: {schema: {$ref: '#/components/schemas/MessageListEnvelope'}}}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    post:
      summary: Send an idempotent message to a conversation
      description: >-
        client_message_id is unique per sender. Reusing it with the same
        conversation and body returns the original message; a different payload
        returns a conflict.
      operationId: sendConversationMessage
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ConversationID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateMessage'}
      responses:
        '201': {$ref: '#/components/responses/Message'}
        '200':
          description: Idempotent replay of the original message
          headers:
            Idempotency-Replayed: {schema: {type: string, const: 'true'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/MessageEnvelope'}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /events:
    get:
      summary: Poll durable notification events after a reconnect cursor
      description: >-
        HTTP polling is the reconnect mechanism for this slice. Events are
        returned oldest first after the supplied user-scoped cursor. This is not
        a WebSocket or external push subscription.
      operationId: listReconnectEvents
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Event page plus polling retry hint
          content: {application/json: {schema: {$ref: '#/components/schemas/EventListEnvelope'}}}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /reports:
    post:
      summary: Submit an idempotent report for a visible target
      operationId: submitReport
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/RequiredIdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_type, target_id, reason]
              properties:
                target_type: {type: string, enum: [post, comment, user]}
                target_id: {type: string}
                reason: {type: string, minLength: 5, maxLength: 1000}
      responses:
        '201': {description: Report created, content: {application/json: {schema: {$ref: '#/components/schemas/ReportEnvelope'}}}}
        '200': {description: Idempotent replay, content: {application/json: {schema: {$ref: '#/components/schemas/ReportEnvelope'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /admin/reports:
    get:
      summary: List the moderation report queue
      operationId: listAdminReports
      security: [{bearerAuth: []}]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [open, dismissed, actioned], default: open}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Reports; moderator or admin required
          content: {application/json: {schema: {$ref: '#/components/schemas/ReportListEnvelope'}}}
        '403': {$ref: '#/components/responses/Error'}
  /admin/reports/{report_id}/decision:
    post:
      summary: Decide a report and atomically write notifications plus audit
      operationId: decideAdminReport
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ReportID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision: {type: string, enum: [dismiss, remove_content, suspend_user]}
                reason: {type: string, minLength: 3, maxLength: 500}
      responses:
        '200': {description: Decided report, content: {application/json: {schema: {$ref: '#/components/schemas/ReportEnvelope'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /admin/content:
    get:
      summary: List posts and comments for moderation review
      operationId: listAdminContent
      security: [{bearerAuth: []}]
      parameters:
        - {name: type, in: query, schema: {type: string, enum: [all, post, comment], default: all}}
        - {name: status, in: query, schema: {type: string, enum: [draft, pending, published, rejected, deleted]}}
        - {name: author_id, in: query, schema: {type: string}}
        - {name: report_status, in: query, schema: {type: string, enum: [open, dismissed, actioned]}}
        - {name: q, in: query, schema: {type: string, maxLength: 100}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Content review page; moderator or admin required
          content: {application/json: {schema: {$ref: '#/components/schemas/ContentReviewListEnvelope'}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /admin/posts/{post_id}/moderation:
    post:
      summary: Transition an explicitly pending post to published or rejected
      operationId: moderatePendingPost
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/PostID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision: {type: string, enum: [published, rejected]}
                reason: {type: string, minLength: 3, maxLength: 500}
      responses:
        '200': {description: Decision and immutable audit event committed atomically, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /admin/posts/{post_id}/controls:
    patch:
      summary: Set audited pin or recommendation controls on a published post
      operationId: updatePostFeedControls
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/PostID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                pinned: {type: boolean}
                recommended: {type: boolean}
                reason: {type: string, minLength: 3, maxLength: 500}
              anyOf: [{required: [pinned]}, {required: [recommended]}]
      responses:
        '200': {description: Feed controls and immutable audit event committed atomically, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /admin/users:
    get:
      summary: Search and filter users (admin only)
      operationId: listAdminUsers
      security: [{bearerAuth: []}]
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 100}}
        - {name: status, in: query, schema: {type: string, enum: [active, suspended]}}
        - {name: role, in: query, schema: {type: string, enum: [member, moderator, admin]}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Cursor-paged private user records; admin required
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminUserListEnvelope'}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /admin/users/{user_id}/status:
    patch:
      summary: Activate or suspend a user and atomically write an audit event
      description: >-
        Suspending a user revokes active sessions. An admin cannot suspend their
        own account or the last active admin.
      operationId: updateAdminUserStatus
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UserID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateUserStatus'}
      responses:
        '200':
          description: Current user record plus whether the status changed
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminUserStatusEnvelope'}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /admin/categories:
    post:
      summary: Create a category and audit the mutation (admin only)
      operationId: createAdminCategory
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateTaxonomy'}}}
      responses:
        '201': {description: Created category, content: {application/json: {schema: {$ref: '#/components/schemas/CategoryEnvelope'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /admin/categories/{category_id}:
    patch:
      summary: Update a category and audit the mutation (admin only)
      operationId: updateAdminCategory
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CategoryID'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateTaxonomy'}}}
      responses:
        '200': {description: Updated category, content: {application/json: {schema: {$ref: '#/components/schemas/CategoryEnvelope'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    delete:
      summary: Delete an unused category and audit the reason (admin only)
      operationId: deleteAdminCategory
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CategoryID'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DeleteTaxonomy'}}}
      responses:
        '200': {$ref: '#/components/responses/Interaction'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /admin/tags:
    post:
      summary: Create a tag and audit the mutation (admin only)
      operationId: createAdminTag
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateTaxonomy'}}}
      responses:
        '201': {description: Created tag, content: {application/json: {schema: {$ref: '#/components/schemas/TagEnvelope'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /admin/tags/{tag_id}:
    patch:
      summary: Update a tag and audit the mutation (admin only)
      operationId: updateAdminTag
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TagID'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateTaxonomy'}}}
      responses:
        '200': {description: Updated tag, content: {application/json: {schema: {$ref: '#/components/schemas/TagEnvelope'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    delete:
      summary: Delete an unused tag and audit the reason (admin only)
      operationId: deleteAdminTag
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TagID'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DeleteTaxonomy'}}}
      responses:
        '200': {$ref: '#/components/responses/Interaction'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /admin/audit-events:
    get:
      summary: List immutable audit events (admin only)
      operationId: listAuditEvents
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Audit event page
          content: {application/json: {schema: {$ref: '#/components/schemas/AuditListEnvelope'}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /users/{user_id}:
    get:
      summary: Get an active public user profile visible to the viewer
      operationId: getPublicUserProfile
      parameters: [{$ref: '#/components/parameters/UserID'}]
      responses:
        '200': {description: Public profile and viewer-relative relation state, content: {application/json: {schema: {$ref: '#/components/schemas/PublicProfileEnvelope'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /users/{user_id}/posts:
    get:
      summary: List posts by a user that are visible to the current viewer
      description: Public posts are always eligible; followers-only posts require the current viewer to follow the author. Block relationships hide the profile and its content.
      operationId: listPublicUserPosts
      parameters: [{$ref: '#/components/parameters/UserID'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {$ref: '#/components/responses/PostList'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /users/{user_id}/comments:
    get:
      summary: List a user's comments whose parent posts are visible to the current viewer
      operationId: listPublicUserComments
      parameters: [{$ref: '#/components/parameters/UserID'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {$ref: '#/components/responses/CommentList'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /users/{user_id}/followers:
    get:
      summary: List visible followers of an active user
