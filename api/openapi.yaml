      operationId: localMetrics
      responses:
        '200': {description: Process-local metrics snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}
  /product-types:
    get:
      summary: List active local product types
      operationId: listProductTypes
      responses: {'200': {description: Product type catalog, content: {application/json: {schema: {$ref: '#/components/schemas/DataEnvelope'}}}}}
  /products:
    get:
      summary: List active local products; products intentionally have no price or payment fields
