      parameters: [{$ref: '#/components/parameters/UserID'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Visible follower page, content: {application/json: {schema: {$ref: '#/components/schemas/PublicUserListEnvelope'}}}}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /users/{user_id}/following:
    get:
      summary: List visible users followed by an active user
      operationId: listUserFollowing
      parameters: [{$ref: '#/components/parameters/UserID'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Visible following page, content: {application/json: {schema: {$ref: '#/components/schemas/PublicUserListEnvelope'}}}}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /users/{user_id}/block:
    put:
      summary: Idempotently block a user and remove follows in both directions
      operationId: blockUser
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UserID'}]
      responses:
        '200': {$ref: '#/components/responses/Interaction'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    delete:
      summary: Idempotently remove the current user's block
      operationId: unblockUser
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UserID'}]
      responses:
        '200': {$ref: '#/components/responses/Interaction'}
        '401': {$ref: '#/components/responses/Error'}
  /me/blocks:
    get:
      summary: List users blocked by the current user
      operationId: listMyBlocks
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Blocked-user page, content: {application/json: {schema: {$ref: '#/components/schemas/PublicUserListEnvelope'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /categories/{category_id}/follow:
    put:
      summary: Idempotently follow a category
      operationId: followCategory
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CategoryID'}]
      responses:
        '200': {$ref: '#/components/responses/Interaction'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      summary: Idempotently unfollow a category
      operationId: unfollowCategory
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CategoryID'}]
      responses:
        '200': {$ref: '#/components/responses/Interaction'}
        '401': {$ref: '#/components/responses/Error'}
  /me/category-follows:
    get:
      summary: List categories followed by the current user
      operationId: listMyCategoryFollows
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Category-follow page, content: {application/json: {schema: {$ref: '#/components/schemas/CategoryFollowListEnvelope'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /me/cover:
    put:
      summary: Upload and set the current user's public profile cover image
      operationId: uploadMyCover
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
                alt_text: {type: string, maxLength: 500}
      responses:
        '201': {$ref: '#/components/responses/Media'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
